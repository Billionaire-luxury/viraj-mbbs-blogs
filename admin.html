<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Clinic Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/admin.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f766e'/%3E%3Cpath d='M13 7h6v6h6v6h-6v6h-6v-6H7v-6h6z' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Login -->
  <div class="login" id="login" hidden>
    <div class="card">
      <span class="side-brand" style="padding:0;border:0"><span class="mark" id="login-mark"></span></span>
      <h1>Doctor login</h1>
      <p class="muted" id="login-help" style="margin:0"></p>
      <form id="login-form">
        <div class="field" id="login-email-wrap"><label for="login-email">Email</label><input class="input" id="login-email" type="email" autocomplete="username"></div>
        <div class="field"><label for="login-pass" id="login-pass-label">Password</label><input class="input" id="login-pass" type="password" autocomplete="current-password" required></div>
        <div id="login-msg" aria-live="polite"></div>
        <button class="btn btn-primary" type="submit" style="padding:10px">Sign in</button>
        <a href="index.html" class="muted" style="text-align:center;font-size:13px">Back to website</a>
      </form>
    </div>
  </div>

  <!-- App -->
  <div class="app" id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Main menu">
      <div class="side-brand">
        <span class="mark" id="brand-mark"></span>
        <div style="min-width:0"><b id="brand-name"></b><small>Clinic dashboard</small></div>
      </div>
      <nav class="side-nav">
        <div class="side-group">Clinic</div>
        <button class="side-link" data-page="overview"><span data-i="grid"></span>Overview</button>
        <button class="side-link" data-page="appointments"><span data-i="calendar"></span>Appointments<span class="badge" id="badge-appts">0</span></button>
        <div class="side-group">Blog</div>
        <button class="side-link" data-page="posts"><span data-i="file"></span>All posts<span class="badge" id="badge-posts">0</span></button>
        <button class="side-link" data-page="editor"><span data-i="pen"></span>Write a post</button>
        <div class="side-group">Website</div>
        <a class="side-link" href="index.html" target="_blank" rel="noopener"><span data-i="external"></span>View website</a>
        <a class="side-link" href="blog.html" target="_blank" rel="noopener"><span data-i="monitor"></span>View blog</a>
      </nav>
      <div class="side-foot">
        <div class="source" id="source"></div>
        <button class="side-link" id="btn-export"><span data-i="download"></span>Download backup</button>
        <button class="side-link" id="btn-import"><span data-i="upload"></span>Restore backup</button>
        <button class="side-link" id="btn-logout"><span data-i="logout"></span>Sign out</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"></button>
        <div class="titles">
          <div class="section" id="page-section"></div>
          <h1 id="page-title"></h1>
        </div>
        <div class="tools" id="page-tools"></div>
        <button class="icon-btn" id="theme-btn" aria-label="Switch light or dark mode"></button>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>

  <!-- Appointment dialog -->
  <dialog id="appt-dlg" aria-labelledby="appt-dlg-title">
    <form id="appt-form" method="dialog" novalidate>
      <div class="dlg-head"><h2 id="appt-dlg-title">Appointment</h2><button type="button" class="icon-btn" data-close aria-label="Close"></button></div>
      <div class="dlg-body">
        <input type="hidden" name="id">
        <div class="field full"><label for="a-name">Patient name *</label><input class="input" id="a-name" name="patient_name" required></div>
        <div class="field"><label for="a-phone">Phone *</label><input class="input" id="a-phone" name="phone" type="tel" required></div>
        <div class="field"><label for="a-email">Email</label><input class="input" id="a-email" name="email" type="email"></div>
        <div class="field"><label for="a-age">Age</label><input class="input" id="a-age" name="age" type="number" min="0" max="120"></div>
        <div class="field"><label for="a-gender">Gender</label><select class="select" id="a-gender" name="gender"><option value="">—</option><option>Female</option><option>Male</option><option>Other</option></select></div>
        <div class="field"><label for="a-date">Date *</label><input class="input" id="a-date" name="appt_date" type="date" required></div>
        <div class="field"><label for="a-time">Time *</label><input class="input" id="a-time" name="appt_time" type="time" required></div>
        <div class="field full"><label for="a-status">Status</label>
          <select class="select" id="a-status" name="status"><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select>
        </div>
        <div class="field full"><label for="a-reason">Reason for visit</label><textarea class="textarea" id="a-reason" name="reason" rows="2"></textarea></div>
        <div class="field full"><label for="a-notes">Private notes (only you can see these)</label><textarea class="textarea" id="a-notes" name="notes" rows="3"></textarea></div>
        <div class="full" id="appt-msg" aria-live="polite"></div>
      </div>
      <div class="dlg-foot">
        <button type="button" class="btn" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary" value="save">Save appointment</button>
      </div>
    </form>
  </dialog>

  <!-- Confirm dialog -->
  <dialog id="confirm-dlg" style="width:min(420px, calc(100vw - 32px))">
    <div class="dlg-head"><h2 id="confirm-title">Are you sure?</h2></div>
    <div style="padding:16px 20px" id="confirm-text"></div>
    <div class="dlg-foot"><button class="btn" id="confirm-no">Cancel</button><button class="btn btn-primary" id="confirm-yes">Yes</button></div>
  </dialog>

  <script src="config.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
